<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geo Gallery</title>

  <!-- Leaflet map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      background: #1a1a1a;
      color: #eee;
    }

    /* Left panel — the map */
    #map {
      flex: 1;
      height: 100vh;
    }

    /* Right panel — form + pin detail */
   #sidebar {
      width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #222;
      border-left: 1px solid #333;
      overflow-y: auto;
      transition: width 0.3s ease;
    }

    #sidebar.expanded {
      width: 680px;
    }

    #expand-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #2a2a2a;
      border: 1px solid #333;
      color: #aaa;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
    }

    #expand-btn:hover { color: #eee; border-color: #555; }

    #detail-section {
      position: relative;
    }

    .nav-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .nav-btn.back {
      background: #2a2a2a;
      color: #888;
      border: 1px solid #333;
    }

    .nav-btn.back:hover { color: #eee; border-color: #555; }

    .nav-btn.forward {
      background: #c0392b;
      color: white;
    }

    .nav-btn.forward:hover { background: #e74c3c; }

    .nav-btn.unlock {
      background: #c0392b;
      color: white;
    }

    .nav-btn.unlock:hover { background: #e74c3c; }

    #sidebar h2 {
      padding: 20px;
      font-size: 16px;
      font-weight: 500;
      color: #aaa;
      border-bottom: 1px solid #333;
    }

    /* Add pin form */
    #form-section {
      padding: 20px;
      border-bottom: 1px solid #333;
    }

    #form-section p {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }

    #form-section input[type="text"],
    #form-section textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
      padding: 10px;
      margin-bottom: 10px;
      outline: none;
    }

    #form-section textarea {
      resize: vertical;
      height: 80px;
    }

    #form-section input[type="file"] {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 12px;
      width: 100%;
    }

    #coords-display {
      font-size: 12px;
      color: #555;
      margin-bottom: 12px;
    }

    #save-btn {
      width: 100%;
      padding: 10px;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    #save-btn:hover { background: #3a8a63; }
    #save-btn:disabled { background: #333; color: #555; cursor: not-allowed; }

    /* Pin detail view */
    #detail-section {
      padding: 20px;
      display: none;
    }

    #detail-section h3 {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #ddd;
    }

    #detail-media {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #111;
    }

    #detail-description {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }

    #detail-coords {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
    }

    #close-detail {
      margin-top: 16px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      text-decoration: underline;
    }

    #close-detail:hover { color: #aaa; }

    .pin-tooltip {
  background: #1a1a1a;
  border: 1px solid #c0392b;
  color: #eee;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 4px;
  box-shadow: none;
}

.leaflet-tooltip-top:before {
  border-top-color: #c0392b;
}
#media-upload-area {
      margin-bottom: 10px;
    }

    #media-preview-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .media-preview-item {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
    }

    .media-preview-item img,
    .media-preview-item video {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .media-preview-item audio {
      width: 100%;
      margin-bottom: 8px;
    }

    .media-preview-item input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 5px;
      color: #aaa;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
    }

    .media-stack {
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin-bottom: 16px;
    }

    .media-stack-item img,
    .media-stack-item video {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    .media-stack-item audio {
      width: 100%;
      margin-top: 4px;
    }

    .media-caption {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      padding: 0 2px;
    }
  </style>
</head>
<body>

  <!-- The map fills the left side -->
  <div id="map"></div>

  <!-- Sidebar on the right -->
  <div id="sidebar">
    <h2>Geo Gallery</h2>
    <button id="expand-btn" onclick="toggleExpand()">⤢ Expand</button>

    <!-- Add pin form -->
    <div id="form-section">
      <p>Click anywhere on the map to place a pin, then fill in the details below.</p>

      <div id="coords-display">No location selected yet</div>

      <input type="text" id="input-title" placeholder="Pin title..."/>
      <textarea id="input-description" placeholder="Describe this place..."></textarea>

      <div id="media-upload-area">
        <input type="file" id="input-file" accept="image/*,video/*,audio/*" multiple/>
        <div id="media-preview-list"></div>
      </div>

      <button id="save-btn" disabled>Select a location first</button>
    </div>

    <!-- Pin detail (shown when you click an existing pin) -->
    <div id="detail-section">
      <h3 id="detail-title">Pin</h3>
      <div id="detail-media-wrap"></div>
      <p id="detail-description"></p>
      <p id="detail-coords"></p>
      <span id="close-detail">← Back to form</span>
    </div>
  </div>

  <!-- Map logic -->
  <script src="map.js"></script>
</body>
</html>
